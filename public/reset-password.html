<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Password | RecorDs</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/assets/records-icon-192.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile-form-controls.css">
    <link rel="stylesheet" href="css/notification.css">
</head>
<body class="login-page password-reset-page">
    <main class="auth-container password-reset-container">
        <section class="auth-info" aria-hidden="true"><div class="info-content"><p class="eyebrow">SMART RECORDS. BETTER SERVICE.</p><h1>Manage Records<br><span>with Confidence</span></h1></div></section>
        <section class="auth-form"><div class="login-card password-reset-card">
            <div class="login-brand"><img src="assets/records-logo-transparent.png" alt="RecorDs logo"></div>
            <h2>Create New Password</h2>
            <p class="subtitle">Use a new password for your RecorDs account.</p>
            <form id="resetPasswordForm">
                <label for="newPassword">New Password</label>
                <div class="input-wrap"><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="password-toggle reset-password-toggle" data-target="newPassword" aria-label="Show password" title="Show password"><span aria-hidden="true">&#9673;</span></button></div>
                <label for="confirmPassword">Confirm New Password</label>
                <div class="input-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="password-toggle reset-password-toggle" data-target="confirmPassword" aria-label="Show password" title="Show password"><span aria-hidden="true">&#9673;</span></button></div>
                <p class="password-requirements">Password must be at least 8 characters long.</p>
                <button type="submit" class="login-button" id="resetPasswordButton"><span>Change Password</span><span class="button-arrow" aria-hidden="true">&#8594;</span></button>
            </form>
            <p class="reset-link"><a href="index.html">Back to Login</a></p>
        </div></section>
    </main>
    <script src="js/notification.js"></script>
    <script src="js/password-reset.js"></script>
</body>
</html>
