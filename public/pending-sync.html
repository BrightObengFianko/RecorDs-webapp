<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecorDs - Pending Sync</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/notification.css">
    <link rel="stylesheet" href="css/confirm-dialog.css">
    <link rel="stylesheet" href="css/mobile-form-controls.css">
    <link rel="stylesheet" href="css/offline.css">
    <link rel="stylesheet" href="css/pending-sync.css">
</head>
<body>
    <svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
        <symbol id="icon-chevron-left" viewBox="0 0 24 24">
            <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
        </symbol>
        <symbol id="icon-chevron-right" viewBox="0 0 24 24">
            <path d="M9 18l6-6-6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
        </symbol>
        <symbol id="icon-logout" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 17l5-5-5-5"></path>
                <path d="M15 12H3"></path>
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            </g>
        </symbol>
    </svg>

    <div class="page">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">R</div>
                <span>RecorDs</span>
            </div>
            <nav class="navigation">
                <a href="dashboard.html" class="nav-item">
                    <svg class="ui-icon nav-icon" aria-hidden="true"><use href="/assets/navigation-icons.svg#icon-home"></use></svg>
                    <span>Dashboard</span>
                </a>
                <a href="create-record.html" class="nav-item">
                    <svg class="ui-icon nav-icon" aria-hidden="true"><use href="/assets/navigation-icons.svg#icon-plus"></use></svg>
                    <span>Record Case</span>
                </a>
                <a href="search-cases.html" class="nav-item">
                    <svg class="ui-icon nav-icon" aria-hidden="true"><use href="/assets/navigation-icons.svg#icon-search"></use></svg>
                    <span>Search Cases</span>
                </a>
                <a href="reports.html" class="nav-item nav-item-admin-only">
                    <svg class="ui-icon nav-icon" aria-hidden="true"><use href="/assets/navigation-icons.svg#icon-chart"></use></svg>
                    <span>Reports</span>
                </a>
                <a href="users.html" class="nav-item nav-item-admin-only">
                    <svg class="ui-icon nav-icon" aria-hidden="true"><use href="/assets/navigation-icons.svg#icon-users"></use></svg>
                    <span>Users</span>
                </a>
                <a href="account.html" class="nav-item nav-item-staff-admin-only">
                    <svg class="ui-icon nav-icon" aria-hidden="true"><use href="/assets/navigation-icons.svg#icon-user"></use></svg>
                    <span>Account</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <svg class="ui-icon nav-icon" aria-hidden="true"><use href="/assets/navigation-icons.svg#icon-gear"></use></svg>
                    <span>Settings</span>
                </a>
            </nav>
            <div class="sidebar-bottom">
                <div class="user-box">
                    <div class="avatar" id="sidebarAvatar">A</div>
                    <div class="user-info">
                        <strong id="sidebarUserName">Admin</strong>
                        <small id="sidebarUserRole">Administrator</small>
                    </div>
                </div>
                <button class="logout" id="logoutButton" type="button" aria-label="Logout" title="Logout">
                    <svg class="ui-icon logout-icon" aria-hidden="true"><use href="#icon-logout"></use></svg>
                </button>
            </div>
        </aside>

        <main class="main pending-sync-main">
            <header class="pending-sync-heading">
                <div class="pending-sync-heading-copy">
                    <div class="pending-sync-title-row">
                        <button class="sidebar-toggle page-toggle" id="sidebarToggle" type="button" title="Toggle sidebar" aria-label="Toggle sidebar">
                            <svg class="ui-icon toggle-icon" aria-hidden="true"><use href="#icon-chevron-left"></use></svg>
                        </button>
                        <h1>Pending Sync</h1>
                    </div>
                    <p>Cases saved on this device that have not reached the server.</p>
                </div>
                <button type="button" class="pending-sync-button" id="pendingSyncButton">Sync Now</button>
            </header>

            <section class="pending-sync-summary" aria-live="polite">
                <strong id="pendingSyncCount">0 records waiting to sync</strong>
                <span id="pendingSyncState">Loading local queue...</span>
            </section>

            <section class="pending-sync-list" id="pendingSyncList" aria-live="polite"></section>
        </main>
    </div>

    <script src="js/notification.js"></script>
    <script src="js/confirm-dialog.js"></script>
    <script src="js/app-settings.js"></script>
    <script src="js/offline-records.js"></script>
    <script src="js/pending-sync.js"></script>
</body>
</html>
