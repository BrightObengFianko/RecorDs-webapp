<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/assets/records-icon-192.png">

    <title>RecorDs-Create Record</title>

    <script>
        (function () {
            if (window.__recordAuthBoot === true) {
                return;
            }

            window.__recordAuthBoot = true;
            document.documentElement.style.visibility = "hidden";
            document.documentElement.style.opacity = "0";

            const bootStyle = document.createElement("style");
            bootStyle.id = "record-auth-boot-style";
            bootStyle.textContent = "html, body { visibility: hidden; opacity: 0; } body.record-auth-loading { visibility: visible; opacity: 1; }";
            document.head.appendChild(bootStyle);
        })();
    </script>

    <link
        rel="stylesheet"
        href="css/create-record.css"
    >
    <link
        rel="stylesheet"
        href="css/notification.css"
    >
    <link
        rel="stylesheet"
        href="css/confirm-dialog.css"
    >
    <link
        rel="stylesheet"
        href="css/sidebar.css"
    >
    <link rel="stylesheet" href="css/mobile-form-controls.css">
    <link rel="stylesheet" href="css/admin-notifications.css">
</head>


<body>

    <svg
        aria-hidden="true"
        focusable="false"
        style="position:absolute;width:0;height:0;overflow:hidden"
    >
        <symbol id="icon-home" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

                <path d="M6 9.75V20h12V9.75"></path>
                <path d="M9 20v-6h6v6"></path>
            </g>
        </symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
            </g>
        </symbol>
        <symbol id="icon-search" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="6.5"></circle>
                <path d="M16 16l5 5"></path>
            </g>
        </symbol>
        <symbol id="icon-users" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4.5 20a6 6 0 0 1 11 0"></path>
                <circle cx="10" cy="8.5" r="3.2"></circle>
                <circle cx="17" cy="9.5" r="2.4"></circle>
                <path d="M15.2 20a4.6 4.6 0 0 1 4.3-3"></path>
            </g>
        </symbol>
        <symbol id="icon-building" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                <path d="M8 20v-5h8v5"></path>
                <path d="M8 8h.01"></path>
                <path d="M12 8h.01"></path>
                <path d="M16 8h.01"></path>
                <path d="M8 12h.01"></path>
                <path d="M12 12h.01"></path>
                <path d="M16 12h.01"></path>
            </g>
        </symbol>
        <symbol id="icon-mail" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3.5" y="5.5" width="17" height="13" rx="2"></rect>
                <path d="M4 7l8 6 8-6"></path>
            </g>
        </symbol>
        <symbol id="icon-chart" viewBox="0 0 24 24">
            <g fill="currentColor">
                <rect x="5" y="11" width="3" height="8" rx="1"></rect>
                <rect x="10.5" y="7" width="3" height="12" rx="1"></rect>
                <rect x="16" y="4" width="3" height="15" rx="1"></rect>
            </g>
        </symbol>
        <symbol id="icon-list" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 6h12"></path>
                <path d="M8 12h12"></path>
                <path d="M8 18h12"></path>
                <circle cx="4" cy="6" r="1"></circle>
                <circle cx="4" cy="12" r="1"></circle>
                <circle cx="4" cy="18" r="1"></circle>
            </g>
        </symbol>
        <symbol id="icon-gear" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3.2"></circle>
                <circle cx="12" cy="12" r="8"></circle>
                <path d="M12 2.8v2.2"></path>

                <path d="M19 12h2.2"></path>
                <path d="M5.35 5.35l1.55 1.55"></path>
                <path d="M17.1 17.1l1.55 1.55"></path>
                <path d="M18.65 5.35l-1.55 1.55"></path>
                <path d="M6.9 17.1l-1.55 1.55"></path>
            </g>
        </symbol>
        <symbol id="icon-logout" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 17l5-5-5-5"></path>
                <path d="M15 12H3"></path>
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            </g>
        </symbol>
        <symbol id="icon-chevron-left" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"></path>
            </g>
        </symbol>
        <symbol id="icon-chevron-right" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18l6-6-6-6"></path>
            </g>

    </svg>

    <div class="page">

        <!-- =====================================
             SIDEBAR
        ====================================== -->

        <aside class="sidebar">

            <div class="brand">
                <div class="brand-icon">R</div>
                <span>RecorDs</span>
            </div>

            <nav class="navigation">
                <a href="dashboard.html" class="nav-item">
                    <svg class="ui-icon nav-icon" aria-hidden="true">
                        <use href="#icon-home"></use>
                    </svg>
                    <span>Dashboard</span>
                </a>

                <a href="create-record.html" class="nav-item active" aria-current="page">
                    <svg class="ui-icon nav-icon" aria-hidden="true">
                        <use href="#icon-plus"></use>
                    </svg>
                    <span>Record Case</span>
                </a>

                <a href="search-cases.html" class="nav-item">
                    <svg class="ui-icon nav-icon" aria-hidden="true">
                        <use href="#icon-search"></use>
                    </svg>
                    <span>Search Cases</span>
                </a>

                <a href="reports.html" class="nav-item nav-item-admin-only">
                    <svg class="ui-icon nav-icon" aria-hidden="true">
                        <use href="#icon-chart"></use>
                    </svg>
                    <span>Reports</span>
                </a>

                <a href="users.html" class="nav-item nav-item-admin-only">
                    <svg class="ui-icon nav-icon" aria-hidden="true">
                        <use href="#icon-users"></use>
                    </svg>
                    <span>Users</span>
                </a>

                <a href="account.html" class="nav-item nav-item-staff-admin-only">
                    <svg class="ui-icon nav-icon" aria-hidden="true">
                        <use href="#icon-user"></use>
                    </svg>
                    <span>Account</span>
                </a>

                <a href="settings.html" class="nav-item">
                    <svg class="ui-icon nav-icon" aria-hidden="true">
                        <use href="#icon-gear"></use>
                    </svg>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-bottom">
                <div class="user-box">
                    <div class="avatar" id="sidebarAvatar">A</div>
                    <div class="user-info">
                        <strong id="sidebarUserName">Admin</strong>
                        <small id="sidebarUserRole">staff</small>
                    </div>
                </div>

                <button
                    id="logoutButton"
                    class="logout"
                    type="button"
                    aria-label="Logout"
                    title="Logout"
                >
                    <svg class="ui-icon logout-icon" aria-hidden="true">
                        <use href="#icon-logout"></use>
                    </svg>
                </button>
            </div>

        </aside>


        <!-- =====================================
             MAIN CONTENT
        ====================================== -->

        <main class="main">

            <section class="content">

                <div class="page-heading">
                    <button class="sidebar-toggle page-toggle" id="sidebarToggle" type="button" title="Toggle sidebar">
                        <svg class="ui-icon toggle-icon" aria-hidden="true">
                            <use href="#icon-chevron-left"></use>
                        </svg>
                    </button>
                    <h1>RECORD CASE</h1>
                    <p>Create a new customer record.</p>
                </div>

                <div class="form-card">

                    <form
                        id="recordForm"
                        autocomplete="off"
                    >

                        <div class="form-row category-registrar-row">
                            <div class="form-group">
                                <label for="category">Category</label>

                                <select
                                    id="category"
                                    name="category"
                                    required
                                >
                                    <option
                                        value=""
                                        selected
                                        disabled
                                    >
                                        Select category
                                    </option>
                                    <option value="S-HOT">S-HOT</option>
                                    <option value="EXPRESS">EXPRESS</option>
                                    <option value="STANDARD">STANDARD</option>
                                    <option value="M-BIRTH">M-BIRTH</option>
                                    <option value="SEARCH">SEARCH</option>
                                    <option value="CORRECTION">CORRECTION</option>
                                    <option value="DEATH">DEATH</option>
                                    <option value="DELETION">DELETION</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="registrar">Registrar</label>

                                <input
                                    type="text"
                                    id="registrar"
                                    name="registrar"
                                    autocapitalize="characters"
                                    autocomplete="off"
                                >
                            </div>
                        </div>

                        <div class="form-row name-date-row">
                            <div class="form-group">
                                <label for="customerName">Customer Name</label>

                                <input
                                    type="text"
                                    id="customerName"
                                    name="name"
                                    placeholder="Enter customer name"
                                    autocomplete="name"
                                    autocapitalize="characters"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label
                                    for="dateOfBirth"
                                    id="dateLabel"
                                >
                                    Date of Birth
                                </label>

                                <input
                                    type="text"
                                    id="dateOfBirth"
                                    name="date_of_birth"
                                    placeholder="DD-MM-YYYY"
                                    inputmode="numeric"
                                    autocomplete="bday"
                                    maxlength="10"
                                    pattern="[0-9]{2}-[0-9]{2}-[0-9]{4}"
                                    required
                                >
                            </div>
                        </div>

                        <div class="form-row phone-status-row">
                            <div class="form-group">
                                <label for="phoneNumber">Phone Number</label>

                                <input
                                    type="tel"
                                    id="phoneNumber"
                                    name="phone_number"
                                    placeholder="Enter phone number"
                                    autocomplete="tel"
                                    autocapitalize="characters"
                                    inputmode="tel"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label for="status">Status</label>

                                <input
                                    type="hidden"
                                    id="status"
                                    name="status"
                                    value="Pending"
                                >

                                <input
                                    type="text"
                                    id="statusDisplay"
                                    value="Pending"
                                    readonly
                                    aria-readonly="true"
                                >
                            </div>

                            <div class="form-group">
                                <label for="registrationDate">Registration Date</label>

                                <div class="registration-date-control">
                                    <input
                                        type="date"
                                        id="registrationDate"
                                        name="registration_date"
                                        readonly
                                        required
                                    >
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="notes">Notes</label>

                            <textarea
                                id="notes"
                                name="notes"
                                placeholder="Enter additional information..."
                                autocapitalize="characters"
                                rows="4"
                            ></textarea>
                        </div>

                        <div class="form-actions">
                            <a
                                href="dashboard.html"
                                class="cancel-button"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="submit-button"
                                id="createRecordButton"
                            >
                                Create Record
                            </button>
                        </div>

                    </form>

                </div>

            </section>

        </main>

    </div>


    <script src="js/notification.js"></script>
    <script src="js/confirm-dialog.js"></script>
    <script src="js/app-settings.js"></script>
    <script src="js/offline-records.js"></script>
    <script src="js/admin-notifications.js"></script>
    <script src="js/create-record.js"></script>

</body>

</html>
