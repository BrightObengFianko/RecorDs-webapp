<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/assets/records-icon-192.png">

    <title>RecorDs-Case Details</title>

    <script>
        (function () {
            if (window.__recordAuthBoot === true) {
                return;
            }

            window.__recordAuthBoot = true;
            document.documentElement.style.visibility = "hidden";
            document.documentElement.style.opacity = "0";

            const bootStyle = document.createElement("style");
            bootStyle.id = "record-auth-boot-style";
            bootStyle.textContent = "html, body { visibility: hidden; opacity: 0; } body.record-auth-loading { visibility: visible; opacity: 1; }";
            document.head.appendChild(bootStyle);
        })();
    </script>

    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/notification.css">
    <link rel="stylesheet" href="css/confirm-dialog.css">
    <link rel="stylesheet" href="css/case-details.css">
    <link rel="stylesheet" href="css/mobile-form-controls.css">
</head>

<body>

    <svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
        <symbol id="icon-home" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 10.5L12 4l8 6.5"></path>
                <path d="M6 9.75V20h12V9.75"></path>
                <path d="M9 20v-6h6v6"></path>
            </g>
        </symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
            </g>
        </symbol>
        <symbol id="icon-search" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="6.5"></circle>
                <path d="M16 16l5 5"></path>
            </g>
        </symbol>
        <symbol id="icon-chart" viewBox="0 0 24 24">
            <g fill="currentColor">
                <rect x="5" y="11" width="3" height="8" rx="1"></rect>
                <rect x="10.5" y="7" width="3" height="12" rx="1"></rect>
                <rect x="16" y="4" width="3" height="15" rx="1"></rect>
            </g>
        </symbol>
        <symbol id="icon-list" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 6h12"></path>
                <path d="M8 12h12"></path>
                <path d="M8 18h12"></path>
                <circle cx="4" cy="6" r="1"></circle>
                <circle cx="4" cy="12" r="1"></circle>
                <circle cx="4" cy="18" r="1"></circle>
            </g>
        </symbol>
        <symbol id="icon-users" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4.5 20a6 6 0 0 1 11 0"></path>
                <circle cx="10" cy="8.5" r="3.2"></circle>
                <circle cx="17" cy="9.5" r="2.4"></circle>
                <path d="M15.2 20a4.6 4.6 0 0 1 4.3-3"></path>
            </g>
        </symbol>
        <symbol id="icon-building" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                <path d="M8 20v-5h8v5"></path>
                <path d="M8 8h.01"></path>
                <path d="M12 8h.01"></path>
                <path d="M16 8h.01"></path>
                <path d="M8 12h.01"></path>
                <path d="M12 12h.01"></path>
                <path d="M16 12h.01"></path>
            </g>
        </symbol>
        <symbol id="icon-gear" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3.2"></circle>
                <circle cx="12" cy="12" r="8"></circle>
                <path d="M12 2.8v2.2"></path>
                <path d="M12 19v2.2"></path>
                <path d="M2.8 12H5"></path>
                <path d="M19 12h2.2"></path>
                <path d="M5.35 5.35l1.55 1.55"></path>
                <path d="M17.1 17.1l1.55 1.55"></path>
                <path d="M18.65 5.35l-1.55 1.55"></path>
                <path d="M6.9 17.1l-1.55 1.55"></path>
            </g>
        </symbol>
        <symbol id="icon-logout" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 17l5-5-5-5"></path>
                <path d="M15 12H3"></path>
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            </g>
        </symbol>
        <symbol id="icon-chevron-left" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"></path>
            </g>
        </symbol>
        <symbol id="icon-chevron-right" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18l6-6-6-6"></path>
            </g>
        </symbol>
        <symbol id="icon-calendar" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3.5" y="5.5" width="17" height="15" rx="2"></rect>
                <path d="M8 3.5v4"></path>
                <path d="M16 3.5v4"></path>
                <path d="M3.5 10.5h17"></path>
            </g>
        </symbol>
        <symbol id="icon-user" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="3.5"></circle>
                <path d="M4 20a8 8 0 0 1 16 0"></path>
            </g>
        </symbol>
        <symbol id="icon-mail" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3.5" y="5.5" width="17" height="13" rx="2"></rect>
                <path d="M4 7l8 6 8-6"></path>
            </g>
        </symbol>
        <symbol id="icon-edit" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 20h4l11-11a2.1 2.1 0 0 0 0-3l-1-1a2.1 2.1 0 0 0-3 0L4 16v4z"></path>
                <path d="M13.5 6.5l4 4"></path>
            </g>
        </symbol>
        <symbol id="icon-check" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4.5 12.5l5 5 10-12"></path>
            </g>
        </symbol>
        <symbol id="icon-x" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M5 5l14 14"></path>
                <path d="M19 5L5 19"></path>
            </g>
        </symbol>
    </svg>

    <div class="app">

        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">R</div>
                <span>RecorDs</span>
            </div>

            <nav class="navigation">
                <a href="dashboard.html" class="nav-item">
                    <svg class="ui-icon nav-icon" aria-hidden="true">
                        <use href="#icon-home"></use>
                    </svg>
                    <span>Dashboard</span>
                </a>

                <a href="create-record.html" class="nav-item">
                    <svg class="ui-icon nav-icon" aria-hidden="true">
                        <use href="#icon-plus"></use>
                    </svg>
                    <span>Record Case</span>
                </a>

                <a href="search-cases.html" class="nav-item active" aria-current="page">
                    <svg class="ui-icon nav-icon" aria-hidden="true">
                        <use href="#icon-search"></use>
                    </svg>
                    <span>Search Cases</span>
                </a>

                <a href="reports.html" class="nav-item nav-item-admin-only">
                    <svg class="ui-icon nav-icon" aria-hidden="true">
                        <use href="#icon-chart"></use>
                    </svg>
                    <span>Reports</span>
                </a>

                <a href="users.html" class="nav-item nav-item-admin-only">
                    <svg class="ui-icon nav-icon" aria-hidden="true">
                        <use href="#icon-users"></use>
                    </svg>
                    <span>Users</span>
                </a>

                <a href="account.html" class="nav-item nav-item-staff-admin-only">
                    <svg class="ui-icon nav-icon" aria-hidden="true">
                        <use href="#icon-user"></use>
                    </svg>
                    <span>Account</span>
                </a>

                <a href="settings.html" class="nav-item">
                    <svg class="ui-icon nav-icon" aria-hidden="true">
                        <use href="#icon-gear"></use>
                    </svg>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-bottom">
                <div class="user-box">
                    <div class="avatar" id="sidebarAvatar">A</div>
                    <div class="user-info">
                        <strong id="sidebarUserName">Admin</strong>
                        <small id="sidebarUserRole">Staff</small>
                    </div>
                </div>

                <button class="logout" id="logoutButton" type="button" aria-label="Logout" title="Logout">
                    <svg class="ui-icon logout-icon" aria-hidden="true">
                        <use href="#icon-logout"></use>
                    </svg>
                </button>
            </div>
        </aside>

        <main class="main">
            <div class="page-top">
                <div class="page-top-left">
                    <button class="sidebar-toggle page-toggle" id="sidebarToggle" type="button" title="Toggle sidebar">
                        <svg class="ui-icon toggle-icon" aria-hidden="true">
                            <use href="#icon-chevron-left"></use>
                        </svg>
                    </button>
                    <div class="page-icon">
                        <svg class="ui-icon heading-icon" aria-hidden="true">
                            <use href="#icon-search"></use>
                        </svg>
                    </div>

                    <div class="page-copy">
                        <h2>Case Details</h2>
                        <p id="caseSubtitle">Loading record details...</p>
                    </div>
                </div>

                <div class="page-top-right">
                    <a href="search-cases.html" class="secondary-button">Back to Search</a>
                    <a href="create-record.html" class="heading-action-button" id="editCaseButton" hidden>
                        <svg class="ui-icon heading-action-icon" aria-hidden="true">
                            <use href="#icon-edit"></use>
                        </svg>
                        <span>Edit Case</span>
                    </a>
                </div>
            </div>

            <section class="content">
                <section class="details-panel" id="detailsPanel">
                    <div class="details-header">
                        <div class="details-avatar" id="detailsAvatar">R</div>
                        <div class="details-header-copy">
                            <span class="details-category" id="detailsCategory">-</span>
                            <h1 id="detailsName">Loading...</h1>
                            <p id="detailsBranch">Branch</p>
                        </div>
                    </div>

                    <div class="details-grid">
                        <article class="detail-card">
                            <span class="detail-label">Case ID</span>
                            <strong class="detail-value" id="detailsId">-</strong>
                        </article>

                        <article class="detail-card">
                            <span class="detail-label">Status</span>
                            <strong class="detail-value" id="detailsStatus">-</strong>
                        </article>

                        <article class="detail-card">
                            <span class="detail-label">Date of Birth / Death</span>
                            <strong class="detail-value" id="detailsDate">-</strong>
                        </article>

                        <article class="detail-card">
                            <span class="detail-label">Phone Number</span>
                            <strong class="detail-value" id="detailsPhone">-</strong>
                        </article>

                        <article class="detail-card">
                            <span class="detail-label">Registration Date</span>
                            <strong class="detail-value" id="detailsRegistration">-</strong>
                        </article>

                        <article class="detail-card">
                            <span class="detail-label">Registrar</span>
                            <strong class="detail-value" id="detailsRegistrar">-</strong>
                        </article>

                        <article class="detail-card">
                            <span class="detail-label">SMS</span>
                            <strong class="detail-value" id="detailsSms">-</strong>
                        </article>

                        <article class="detail-card">
                            <span class="detail-label">Branch</span>
                            <strong class="detail-value" id="detailsBranchName">-</strong>
                        </article>

                        <article class="detail-card detail-card-full">
                            <span class="detail-label">Notes</span>
                            <p class="detail-value detail-notes" id="detailsNotes">-</p>
                        </article>
                    </div>
                </section>
            </section>
        </main>
    </div>

    <script src="js/notification.js"></script>
    <script src="js/confirm-dialog.js"></script>
    <script src="js/app-settings.js"></script>
    <script src="js/offline-records.js"></script>
    <script src="js/case-details.js"></script>
</body>

</html>
